spring.application.name=risk-scoring-api

server.port=8080

spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.data.mongodb.uri=mongodb://localhost:27017/risk-scoring
spring.data.mongodb.database=risk-scoring

esg.service.base-url=http://localhost:8000
esg.service.timeout-ms=300000

risk.enhanced.logistic-a=1.5
risk.enhanced.logistic-b=-1.2
risk.enhanced.weight-financial=0.7
risk.enhanced.weight-esg=0.3
risk.enhanced.esg-influence=0.30
risk.enhanced.esg-max-adjustment=0.25
