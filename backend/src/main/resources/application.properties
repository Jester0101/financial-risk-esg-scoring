spring.application.name=risk-scoring-api

# Server configuration
server.port=8080

# CORS configuration for frontend
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MongoDB configuration
spring.data.mongodb.uri=mongodb://localhost:27017/risk-scoring
spring.data.mongodb.database=risk-scoring

# ESG Service configuration
esg.service.base-url=http://localhost:8000
esg.service.timeout-ms=300000

# Risk scoring configuration
# Logistic calibration: PD = 1 / (1 + exp(-(a + b * Z)))
# Calibrated for realistic PD ranges matching Altman zones
risk.enhanced.logistic-a=1.5
risk.enhanced.logistic-b=-1.2
risk.enhanced.weight-financial=0.7
risk.enhanced.weight-esg=0.3
# ESG adjustment calibration (improved for more meaningful impact)
# Formula: adjustment = k × clip(0.5 - ESG, -cMax, cMax)
# Max adjustment: ±7.5% (k=0.30, cMax=0.25 → max = 0.30 × 0.25 = 0.075)
# Direction: ESG > 50% reduces risk; ESG < 50% increases risk
# Example: ESG=57% → adjustment=-2.1% (risk reduced)
risk.enhanced.esg-influence=0.30
risk.enhanced.esg-max-adjustment=0.25
